name: skill-evals

# free-layers: deterministic, every push / PR.
# behaviour-eval: calls models, only on manual dispatch or the weekly schedule
# (see docs/EVALS.md). Skipped unless the EVAL_JUDGE repository variable is set.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "Eval tier"
        default: smoke
        type: choice
        options: [smoke, regression, adversarial]
      budget_usd:
        description: "Budget per skill (USD)"
        default: "2"
  schedule:
    - cron: "0 18 * * 1"

permissions:
  contents: read

jobs:
  free-layers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Static validator (all free layers, warnings fail)
        run: python validate.py --static --strict --json > static-report.json || (cat static-report.json; exit 1)
      - name: Structure lint (frontmatter, name, description)
        run: python scripts/quick_validate.py
      - name: evals.json schema
        run: python scripts/validate_evals.py
      - name: Registry in sync with directories
        run: python scripts/check_registry.py
      - name: Trigger routing and description overlap
        run: python scripts/check_triggers.py
      - name: Security scan
        run: python scripts/security_scan.py
      - name: Script unit tests
        run: python -m pytest -q
      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-report
          path: static-report.json

  behaviour-eval:
    if: github.event_name != 'push' && github.event_name != 'pull_request' && vars.EVAL_JUDGE != ''
    needs: free-layers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: [style-luxun, style-kafka, style-xinhua, style-dostoevsky]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model SDK
        run: python -m pip install anthropic
      - name: Behaviour eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          EVAL_JUDGE: ${{ vars.EVAL_JUDGE }}
        run: >-
          python evaluate.py --skill ${{ matrix.skill }}
          --tier ${{ inputs.tier || 'smoke' }}
          --budget-usd ${{ inputs.budget_usd || '2' }}
      - name: Upload drafts and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.skill }}
          path: |
            evals-workspace/
            results.tsv
          if-no-files-found: ignore
